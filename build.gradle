plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sidewrite.deck'
    compileSdk 34

    defaultConfig {
        applicationId "com.sidewrite.deck"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Fixed debug keystore committed with the project, so every build —
    // cloud or local — produces identically-signed APKs and updates can be
    // installed over previous versions without uninstalling.
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies at all: the whole app is one Activity using framework classes only.
