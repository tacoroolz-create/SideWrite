name: Build APK

# Builds the debug APK on GitHub's servers so no local SDK is needed.
# Triggered automatically on push, or manually from the Actions tab
# ("Run workflow") after editing code.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Installs the Gradle version pinned in gradle-wrapper.properties —
      # no wrapper jar or local Gradle install required.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideWrite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
