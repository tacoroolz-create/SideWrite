name: Build APK

# Builds the debug APK on GitHub's servers so no local SDK is needed.
# Triggered automatically on push, or manually from the Actions tab
# ("Run workflow") after editing code.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship with the Android SDK base at
      # $ANDROID_HOME; we just grant licenses and add the exact components
      # the project needs (this replaces the flaky setup-android action).
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" \
            >/dev/null

      # Installs the Gradle version pinned in gradle-wrapper.properties —
      # no wrapper jar or local Gradle install required.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideWrite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
