plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sidewrite.deck'
    compileSdk 34

    defaultConfig {
        applicationId "com.sidewrite.deck"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No dependencies at all: the whole app is one Activity using framework classes only.